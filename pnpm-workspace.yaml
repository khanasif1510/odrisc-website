allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  esbuild: true
  sharp: true
  unrs-resolver: true

# Keep local tooling usable and install the native image runtime for IIS x64.
supportedArchitectures:
  os: [current, win32]
  cpu: [current, x64]

overrides:
  "brace-expansion@<1.1.18": "1.1.18"
  "brace-expansion@>=4.0.0 <5.0.9": "5.0.9"
  "js-yaml@>=4.0.0 <4.3.1": "4.3.1"
  "nanoid@>=3.0.0 <3.3.17": "3.3.17"
  "postcss@<=8.5.17": "8.5.25"
  "sharp@<0.35.0": "0.35.3"
