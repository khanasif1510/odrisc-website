name: Continuous Integration

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.18.0
  PNPM_VERSION: 11.17.0

jobs:
  quality-static:
    name: Quality — Static
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Run ESLint
        run: pnpm lint

      - name: Check TypeScript
        run: pnpm typecheck

      - name: Validate repository contracts
        run: pnpm validate

  unit-and-component:
    name: Tests — Unit and Component
    needs: quality-static
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage
          if-no-files-found: warn

  storybook:
    name: Storybook — Production Build
    needs: quality-static
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Storybook
        run: pnpm build:storybook

      - name: Upload Storybook build
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: storybook-${{ github.run_id }}-${{ github.run_attempt }}
          path: storybook-static
          if-no-files-found: warn

  production-build:
    name: Build — Next.js Standalone
    needs: quality-static
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build standalone application
        run: pnpm build

      - name: Verify standalone release output
        shell: bash
        run: |
          set -euo pipefail

          test -f .next/standalone/server.js
          test -d .next/static
          test -d public

          printf 'PASS: standalone release output is complete.\n'

      - name: Upload standalone release evidence
        uses: actions/upload-artifact@v6
        with:
          name: standalone-release-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            .next/standalone
            .next/static
            public
          if-no-files-found: error
          include-hidden-files: true

  e2e-chromium:
    name: E2E — Chromium P0
    needs:
      - unit-and-component
      - production-build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Chromium P0 tests
        run: pnpm test:e2e:critical

      - name: Upload Chromium evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: e2e-chromium-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report
            test-results
          if-no-files-found: warn

  e2e-cross-browser-critical:
    name: E2E — Firefox and WebKit P0
    needs:
      - unit-and-component
      - production-build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Firefox and WebKit
        run: pnpm exec playwright install --with-deps firefox webkit

      - name: Run cross-browser P0 tests
        run: pnpm test:e2e:cross-browser

      - name: Upload cross-browser evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: e2e-cross-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report
            test-results
          if-no-files-found: warn

  e2e-arabic-rtl:
    name: E2E — Arabic RTL
    needs:
      - unit-and-component
      - production-build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Arabic RTL tests
        run: pnpm test:e2e:rtl

      - name: Upload Arabic RTL evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: e2e-arabic-rtl-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report
            test-results
          if-no-files-found: warn

  e2e-reduced-motion:
    name: E2E — Reduced Motion
    needs:
      - unit-and-component
      - production-build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run reduced-motion tests
        run: pnpm test:e2e:reduced-motion

      - name: Upload reduced-motion evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: e2e-reduced-motion-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report
            test-results
          if-no-files-found: warn

  container-build:
    name: Container — Build and Runtime
    needs:
      - production-build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Dockerfile
        run: |
          docker build \
            --check \
            --file infra/docker/Dockerfile \
            .

      - name: Build production container
        run: |
          docker build \
            --file infra/docker/Dockerfile \
            --tag odrisc-website:${{ github.sha }} \
            .

      - name: Verify container configuration
        shell: bash
        run: |
          set -euo pipefail

          configured_user="$(
            docker image inspect \
              odrisc-website:${{ github.sha }} \
              --format '{{.Config.User}}'
          )"

          test "${configured_user}" = "nextjs"

          docker image inspect \
            odrisc-website:${{ github.sha }} \
            --format 'Image: {{.Id}}
          Architecture: {{.Architecture}}
          OS: {{.Os}}
          User: {{.Config.User}}
          Working directory: {{.Config.WorkingDir}}
          Healthcheck: {{json .Config.Healthcheck}}' \
            >container-image-metadata.txt

          printf 'PASS: production image is configured for the nextjs user.\n'

      - name: Verify container runtime and health
        shell: bash
        run: |
          set -euo pipefail

          container_name="odrisc-website-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          cleanup() {
            docker rm \
              --force \
              "${container_name}" \
              >/dev/null 2>&1 || true
          }

          trap cleanup EXIT

          docker run \
            --detach \
            --name "${container_name}" \
            --read-only \
            --tmpfs /tmp \
            odrisc-website:${{ github.sha }}

          attempt=1

          while [ "${attempt}" -le 30 ]; do
            health="$(
              docker inspect \
                "${container_name}" \
                --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}'
            )"

            printf 'Attempt %s: %s\n' "${attempt}" "${health}"

            if [ "${health}" = "healthy" ]; then
              runtime_user="$(
                docker exec \
                  "${container_name}" \
                  id -u
              )"

              test "${runtime_user}" = "1001"

              read_only_root="$(
                docker inspect \
                  "${container_name}" \
                  --format '{{.HostConfig.ReadonlyRootfs}}'
              )"

              test "${read_only_root}" = "true"

              docker inspect \
                "${container_name}" \
                --format 'Status: {{.State.Status}}
          Health: {{.State.Health.Status}}
          Read-only root: {{.HostConfig.ReadonlyRootfs}}' \
                >container-runtime-metadata.txt

              docker logs \
                "${container_name}" \
                >container-runtime.log 2>&1

              printf 'PASS: container reached healthy state as UID 1001.\n'
              exit 0
            fi

            if [ "${health}" = "unhealthy" ] || [ "${health}" = "missing" ]; then
              docker inspect \
                "${container_name}" \
                --format '{{json .State.Health}}'

              docker logs "${container_name}"
              exit 1
            fi

            sleep 2
            attempt=$((attempt + 1))
          done

          docker inspect \
            "${container_name}" \
            --format '{{json .State.Health}}'

          docker logs "${container_name}"
          exit 1

      - name: Upload container evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: container-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            container-image-metadata.txt
            container-runtime-metadata.txt
            container-runtime.log
          if-no-files-found: warn
