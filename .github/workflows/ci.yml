name: Continuous Integration

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.18.0
  PNPM_VERSION: 11.17.0

jobs:
  quality-static:
    name: Quality — Static
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Run ESLint
        run: pnpm lint

      - name: Check TypeScript
        run: pnpm typecheck

      - name: Validate repository contracts
        run: pnpm validate

  unit-and-component:
    name: Tests — Unit and Component
    needs: quality-static
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: coverage-${{ github.run_id }}
          path: coverage
          if-no-files-found: warn

  storybook:
    name: Storybook — Production Build
    needs: quality-static
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Storybook
        run: pnpm build:storybook

      - name: Upload Storybook build
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: storybook-${{ github.run_id }}
          path: storybook-static
          if-no-files-found: warn

  production-build:
    name: Build — Next.js Standalone
    needs: quality-static
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build standalone application
        run: pnpm build

      - name: Verify standalone release output
        shell: bash
        run: |
          set -euo pipefail

          test -f .next/standalone/server.js
          test -d .next/static
          test -d public

          printf 'PASS: standalone release output is complete.\n'

      - name: Upload standalone release evidence
        uses: actions/upload-artifact@v6
        with:
          name: standalone-release-${{ github.sha }}
          path: |
            .next/standalone
            .next/static
            public
          if-no-files-found: error
          include-hidden-files: true
